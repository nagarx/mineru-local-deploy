[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru"
dynamic = ["version"]
license = "LicenseRef-MinerU-Open-Source-License"
license-files = ["LICENSE.md"]
description = "A practical document parsing tool for converting PDF, images, DOCX, PPTX, and XLSX into Markdown and JSON"
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = [
    "mineru",
    "magic-pdf",
    "document-parsing",
    "document-understanding",
    "pdf",
    "markdown",
    "ocr",
    "vlm",
    "docx",
    "pptx",
    "xlsx",
    "multimodal",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.7",
    "loguru>=0.7.2",
    "numpy>=1.21.6",
    "tqdm>=4.67.1",
    "requests",
    "httpx",
    "pillow>=11.0.0",
    # DELIBERATELY TIGHTER THAN UPSTREAM (upstream 3.4.4 allows pdftext<0.8 / pypdfium2<6).
    # DO NOT RELAX. The two bugs that originally forced this pin ARE fixed in 3.4.4
    # (PdfImage.get_pos via _get_pdfium_page_object_bounds, PageChars via
    # _ensure_legacy_chars) — but a third, worse reason now keeps it:
    #
    #   pdftext >=0.7 DESTROYS every non-BMP character. Its get_chars() does
    #       if 0xD800 <= code <= 0xDFFF: code = 0xFFFD
    #   treating UTF-16 surrogates as corruption. They are not: FPDFText_GetUnicode
    #   returns UTF-16 CODE UNITS, so every codepoint above U+FFFF legitimately arrives
    #   as a surrogate PAIR — which is the whole Mathematical Alphanumeric Symbols block
    #   (U+1D400–U+1D7FF), i.e. the italic variables maths-heavy papers use for x, t, X, θ.
    #   Measured on one page of CROSSFORMER: 0.6.3 yields 190 recoverable glyphs;
    #   0.7.1 yields 380 U+FFFD and 0 recoverable. The loss happens INSIDE pdftext,
    #   so no downstream repair can undo it — unlike the '??' it replaces.
    #
    # mineru/utils/pdf_text_tool.py::_merge_surrogate_pairs decodes the pairs correctly,
    # but it can only do so while pdftext still hands us the halves. Guarded at runtime by
    # local_deploy/convert.py::preflight_deps and tests/local_deploy/test_surrogate_pairs.py.
    "pypdfium2>=4.30.0,<5",  # pdftext pins this exactly (0.6.3 -> ==4.30.0); they move as a pair
    "pypdf>=5.6.0",
    "reportlab",
    "pdftext>=0.6.3,<0.7",   # see the block comment above — relaxing this silently destroys maths
    "modelscope>=1.26.0",
    "huggingface-hub>=0.32.4",
    "json-repair>=0.46.2",
    "opencv-python>=4.11.0.86",
    "fast-langdetect>=0.2.3,<0.3.0",
    "openai>=1.70.0,<3",
    "beautifulsoup4>=4.13.5,<5",
    "magika>=0.6.2,<1.1.0",
    "mineru-vl-utils>=1.0.5,<2",
    "python-docx>=1.2.0,<2",
    'pypptx-with-oxml>=1.0.3,<2',
    "mammoth>=1.11.0,<2",
    "pylatexenc>=2.10,<3",
    "lxml>=4.0.0,<7.0.0",
    "openpyxl>=3.1.5,<4",
    "fastapi",
    "python-multipart",
    "uvicorn",
]

[project.optional-dependencies]
test = [
    "mineru[core]",
    "pytest",
    "pytest-cov",
    "coverage",
    "fuzzywuzzy",
    "tomli; python_version < '3.11'",
]
vlm = [
    "torch>=2.6.0,<3",
    "transformers>=4.57.3,<5.0.0",
    "accelerate>=1.5.1",
]
vllm = [
    "vllm>=0.10.1.1,<0.22.0",
]
lmdeploy = [
    "lmdeploy>=0.10.2,<0.12",
    "qwen-vl-utils>=0.0.14,<1",
]
mlx = [
    "mlx-vlm>=0.3.3,<0.4",
    "mlx<=0.31.1",
]
s3 = [
    "boto3>=1.28.43",
]
pipeline = [
    "PyYAML>=6.0.1,<7",
    "ftfy>=6.3.1,<7",
    "shapely>=2.0.7,<3",
    "pyclipper>=1.3.0,<2",
    "torch>=2.6.0,<3",
    "torchvision",
    "transformers>=4.57.3,<5.0.0",
    "safetensors>=0.4.0,<1",
    "onnxruntime>1.17.0",
]
gradio = [
    "gradio>=5.49.1,!=6.0.0,!=6.0.1,!=6.0.2,!=6.1.0,!=6.2.0,!=6.3.0,!=6.4.0,!=6.5.0,!=6.5.1,!=6.6.0,!=6.7.0,<6.9.0",
    "gradio-pdf>=0.0.22",
]
core = [
    "mineru[vlm]",
    "mineru[pipeline]",
    "mineru[gradio]",
]
all = [
    "mineru[core]",
    "mineru[s3]",
    "mineru[mlx] ; sys_platform == 'darwin'",
    "mineru[vllm] ; sys_platform == 'linux'",
    "mineru[lmdeploy] ; sys_platform == 'win32'",
]

[project.urls]
homepage = "https://mineru.net/"
documentation = "https://opendatalab.github.io/MinerU/"
repository = "https://github.com/opendatalab/MinerU"
issues = "https://github.com/opendatalab/MinerU/issues"
License = "https://github.com/opendatalab/MinerU/blob/master/LICENSE.md"

[project.scripts]
mineru = "mineru.cli.client:main"
mineru-vllm-server = "mineru.cli.vlm_server:vllm_server"
mineru-lmdeploy-server = "mineru.cli.vlm_server:lmdeploy_server"
mineru-openai-server = "mineru.cli.vlm_server:openai_server"
mineru-models-download = "mineru.cli.models_download:download_models"
mineru-api = "mineru.cli.fast_api:main"
mineru-router = "mineru.cli.router:main"
mineru-gradio = "mineru.cli.gradio_app:main"

[tool.setuptools.dynamic]
version = { attr = "mineru.version.__version__" }

[tool.setuptools.packages.find]
include = ["mineru*"]
namespaces = false

[tool.setuptools.package-data]
"mineru" = ["resources/**"]
"mineru.model.utils.pytorchocr.utils" = ["resources/**"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.pytest.ini_options]
addopts = "-s --cov=mineru --cov-report html"

[tool.coverage.run]
command_line = "-m pytest tests/unittest/test_e2e.py"
source = ["mineru/"]
omit = [
    "*/gradio_app.py",
    "*/models_download.py",
    "*/fast_api.py",
    "*/cli/client.py",
    "*/vlm_vllm_server.py",
    "*/cli_parser.py",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.report]
exclude_also = [
    'def __repr__',
    'if self.debug:',
    'if settings.DEBUG',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["C", "E", "F", "W", "ANN"]
ignore = ["C901", "ANN204", "ANN401"]
